// 由 Maven pom.xml 平移生成（依赖坐标与作用域一一对应）

plugins {
    id 'scaffold.boot-conventions'
}

dependencies {
    // TraceIdConverter 继承 logback 转换器：Maven 经传递依赖进入编译类路径，
    // Gradle 图中被 nacos logback-adapter 的 POM 排除规则截断，显式声明（版本由 Boot BOM 收口）
    api 'ch.qos.logback:logback-classic'

    api 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    api 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery'
    api 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-config'
    api('com.alibaba.cloud:spring-cloud-starter-alibaba-sentinel') {
        exclude group: 'com.alibaba.csp', module: 'sentinel-spring-webmvc-v6x-adapter'
    }
    api 'com.alibaba.cloud:spring-cloud-alibaba-sentinel-gateway'
    api 'com.alibaba.csp:sentinel-datasource-nacos'
    api 'org.springframework.cloud:spring-cloud-loadbalancer'
    api 'org.springframework.boot:spring-boot-starter-actuator'
    api 'org.springframework.boot:spring-boot-starter-webflux'
    api 'pro.fessional:kaptcha'
    api project(':scaffold-common-redis')
}
