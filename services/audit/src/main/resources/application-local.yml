spring:
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${nacos.address:172.26.205.13}:8848
      config:
        enabled: false
    sentinel:
      enabled: false
  config:
    import:
      - classpath:scaffold-audit-local.yml

  autoconfigure:
    exclude: com.alibaba.druid.spring.boot3.autoconfigure.DruidDataSourceAutoConfigure

management:
  endpoints:
    web:
      exposure:
        include: '*'

debug: true
