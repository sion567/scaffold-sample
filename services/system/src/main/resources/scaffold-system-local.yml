spring:
  flyway:
    enabled: true
    clean-disabled: false        # 允许清空
    url: jdbc:h2:file:./data/h2/system;MODE=Oracle;AUTO_SERVER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS SYSTEM_DB\;SET SCHEMA SYSTEM_DB
    driver-class-name: org.h2.Driver
    user: sa
    password:
    baseline-on-migrate: true
    validate-on-migrate: false       # 暂时关闭启动时的严格文件校验，防止死锁
    default-schema: SYSTEM_DB
    locations: classpath:db/migration/h2
    encoding: UTF-8
    table: flyway_schema_history
    out-of-order: false
  data:
    redis:
      host: localhost
      port: 6379
      password:
  datasource:
    druid:
      stat-view-servlet:
        enabled: true
        loginUsername: scaffold
        loginPassword: 123456
    dynamic:
      druid:
        initial-size: 5
        min-idle: 5
        max-active: 20
        max-wait: 60000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 300000
        validation-query: SELECT 1 FROM DUAL
        connectTimeout: 30000
        socketTimeout: 60000
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
        filters: stat,slf4j
        connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      datasource:
        master:
          driver-class-name: org.h2.Driver
          url: jdbc:h2:file:./data/h2/system;MODE=Oracle;AUTO_SERVER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS SYSTEM_DB\;SET SCHEMA SYSTEM_DB
          username: sa
          password:

gm:
  # 国密（BouncyCastle 实现，格式与原 zdhr-crypto 3.0 兼容）：内置管理员初始化用——密码 SM3 哈希 + 手机号 SM4 字段加密。
  # 密钥与 auth 服务共用同一套（BCFKS keystore，dev 密钥库随仓库 gm/gm.bcfks，仅限本地联调；
  # 存量 gm.p12 用 GmKeystoreConvertTool 转换）；
  # 生产：密钥不入仓库，path/store-pass/key-pass 全部走环境变量或配置中心
  keystore:
    path: ${GM_STORE_PATH:./gm/gm.bcfks}
    store-pass: ${GM_STORE_PASS:StorePass123}
    key-pass: ${GM_KEY_PASS:KeyPass123}
    format: BCFKS
    active-alias: ${GM_ACTIVE_ALIAS:202607-h1}
    reload-interval: 300
    fail-fast: true
  sm4:
    root-key-dir: ${GM_SM4_PATH:E:/etc/app/gm}
    root-key-version: v1
    reload-interval: 300

dubbo:
  application:
    metadata-type: remote
    name: scaffold-system
    logger: slf4j
    qos-enable: true
    qos-port: 22221
    check-serializable: false
    serialize-check-status: WARN
  protocol:
    name: tri
    port: 20881
  scan:
    base-packages: com.scaffold.system
  # 显式指定元数据中心地址和认证信息
  registry:
    address: nacos://${nacos.address:172.26.205.13}:8848
    username: ${NACOS_USER:nacos}
    password: ${NACOS_PWD:nacos}
    register-mode: instance
  metadata-report:
    address: nacos://${nacos.address:172.26.205.13}:8848
    username: ${NACOS_USER:nacos}
    password: ${NACOS_PWD:nacos}
    report-metadata: true  # local 模式下仍上报应用级元数据

# JWT SM2 验签公钥：与签发方（scaffold-auth/gateway）同一对（dev 联调；生产经 Nacos/环境变量注入）。
# SecurityContextFilter 恢复 LOGIN_USER 时要用它解 token 取 userKey 反查 Redis，缺失则登录态丢失
jwt:
  sm2:
    public-key: "04aa796e22771f2a2e7d6ddeacdd07d9e0a1bad34949344cc79319c508d08838f1b67fd9d33fc452527a2b4b4f8bf7a57b0d3141434e49d0e8c42a21e1e1401e61"
