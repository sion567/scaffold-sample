spring:
  application:
    name: scaffold-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    web-application-type: none
  cloud:
    nacos:
      username: ${NACOS_USER:nacos}
      password: ${NACOS_PWD:nacos}
      discovery:
        server-addr: ${nacos.address:172.26.205.13}:8848
      config:
        server-addr: ${nacos.address:172.26.205.13}:8848
  config:
    file-extension: yaml
    import:
      - classpath:scaffold-defaults.yml
      - optional:nacos:application-${spring.profiles.active}.${spring.config.file-extension}
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.config.file-extension}

