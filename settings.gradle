// 仓库与插件版本注册（原 Maven：aliyun 镜像 + 根 pom pluginManagement）
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = uri('https://maven.aliyun.com/repository/public') }
    }
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.PREFER_SETTINGS
    repositories {
        // 与 Maven 语义一致：只按 POM 解析，忽略 Gradle 模块元数据（GMM 中第三方自带的
        // 版本约束会越权覆盖本仓 BOM，例如 mybatis-spring-boot 4.0.1 把 Boot 顶到 4.0.1）
        maven {
            url = uri('https://maven.aliyun.com/repository/public')
            metadataSources { mavenPom(); artifact(); ignoreGradleMetadataRedirection() }
        }
        mavenCentral {
            metadataSources { mavenPom(); artifact(); ignoreGradleMetadataRedirection() }
        }
    }
}

// 模块清单：扁平 include（路径 = 原 artifactId），projectDir 指回 Maven 时代的嵌套目录；
// 避免 Gradle 9 为嵌套路径生成与叶子共享目录的占位项目（会重复评估同一 build.gradle）
rootProject.name = "scaffold"

include(':scaffold-bom')
