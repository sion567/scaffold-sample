// 由 Maven pom.xml 平移生成（依赖坐标与作用域一一对应）

plugins {
    id 'scaffold.java-conventions'
}

// warmflow 引擎契约测试默认排除：已换 warm-flow-jpa-sb3-starter（1.8.5），
// 但本机 JDK 的 jboss-logging 3.6.3 引导 Hibernate @SpringBootTest 报
// "lookup does not have access to the implementation class constructor"（jboss-logging 无修复版本），
// @SpringBootTest+JPA 的引擎契约测试（@Tag("warmflow-engine")）在环境修复后恢复默认执行。
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'warmflow-engine'
    }
}

dependencies {
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc'
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    api('org.dromara.warm:warm-flow-jpa-sb3-starter') {
        exclude group: 'com.alibaba.cloud', module: 'spring-cloud-starter-alibaba-nacos-config'
    }
    api 'com.alibaba.fastjson2:fastjson2'
    api 'org.springframework.boot:spring-boot-starter-data-redis'
}
