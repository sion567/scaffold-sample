// 依赖版本收口平台（原 bom/pom.xml dependencyManagement 平移）：
// 项目自定义约束在前优先，框架 BOM 平台垫底（对齐原 import 顺序：scaffold 约束 → Boot → Cloud → Alibaba → Dubbo）

plugins {
    id 'java-platform'
}

group = findProperty('group') ?: 'com.scaffold'
version = findProperty('version') ?: '1.0-SNAPSHOT'

javaPlatform {
    allowDependencies()
}

dependencies {
    // ── 框架 BOM 平台（垫底，不覆盖项目自定义约束） ──
    api(platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}"))
    api(platform("org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"))
    api(platform("com.alibaba.cloud:spring-cloud-alibaba-dependencies:${springCloudAlibabaVersion}"))
    api(platform("org.apache.dubbo:dubbo-bom:${dubboVersion}"))

    // ── 项目自定义三方件约束（优先于框架 BOM）──
    // 必须写在 constraints 块内：java-platform 下裸写 api("g:a:v") 是【真实依赖】，
    // 会被 platform 消费方整包继承——曾导致每个服务（含无库的 auth/gateway/file）
    // 被塞进 flyway/warm-flow/druid/dynamic-datasource/全套 JDBC 驱动，
    // 无库服务启动即 CannotFindDataSourceException。constraints 只收口版本，
    // 用不用由各模块自行声明。
    constraints {
        api("com.google.protobuf:protobuf-java:${protobufVersion}")
        api("pro.fessional:kaptcha:${kaptchaVersion}")
        api("org.dromara.warm:warm-flow-jpa-sb3-starter:${warmFlowVersion}")
        api("com.oracle.database.jdbc:ojdbc11:${ojdbc11Version}")
        api("com.mysql:mysql-connector-j:${mysqlConnectorJVersion}")
        api("org.postgresql:postgresql:${postgresqlVersion}")
        api("com.microsoft.sqlserver:mssql-jdbc:${mssqlJdbcVersion}")
        api("com.ibm.db2:jcc:${db2JccVersion}")
        api("com.dameng:DmJdbcDriver18:${dmJdbcVersion}")
        api("cn.com.kingbase:kingbase8:${kingbase8Version}")
        api("com.highgo:HgdbJdbc:${highgoJdbcVersion}")
        api("org.opengauss:opengauss-jdbc:${opengaussJdbcVersion}")
        api("org.apache.commons:commons-csv:${commonsCsvVersion}")
        api("org.lionsoul:ip2region:${ip2regionVersion}")
        api("commons-io:commons-io:${commonsIoVersion}")
        api("org.apache.commons:commons-lang3:${commonsLang3Version}")
        api("org.apache.poi:poi-ooxml:${poiVersion}")
        api("org.apache.poi:poi:${poiVersion}")
        api("org.apache.commons:commons-collections4:${commonsCollections4Version}")
        api("org.apache.velocity:velocity-engine-core:${velocityVersion}")
        api("com.alibaba.fastjson2:fastjson2:${fastjsonVersion}")
        api("io.jsonwebtoken:jjwt-api:${jjwtVersion}")
        api("io.jsonwebtoken:jjwt-impl:${jjwtVersion}")
        api("io.jsonwebtoken:jjwt-jackson:${jjwtVersion}")
        api("com.alibaba:transmittable-thread-local:${transmittableThreadLocalVersion}")
        api("io.github.resilience4j:resilience4j-reactor:${resilience4jVersion}")
        api("io.github.resilience4j:resilience4j-circuitbreaker:${resilience4jVersion}")
        api("com.github.ben-manes.caffeine:caffeine:${caffeineVersion}")
        api("org.springframework.boot:spring-boot-starter-aop:${springBootVersion}")
        api("org.bouncycastle:bcprov-jdk18on:${bouncycastleVersion}")
        api("org.flywaydb:flyway-core:${flywayVersion}")
        api("org.flywaydb:flyway-mysql:${flywayVersion}")
        api("org.flywaydb:flyway-database-postgresql:${flywayVersion}")
        api("org.flywaydb:flyway-sqlserver:${flywayVersion}")
        api("org.flywaydb:flyway-database-db2:${flywayVersion}")
        api("io.minio:minio:${minioVersion}")
        api("com.alibaba:druid-spring-boot-3-starter:${druidVersion}")
        api("com.baomidou:dynamic-datasource-spring-boot3-starter:${dynamicDsVersion}")
        api("com.alibaba.nacos:nacos-spring-context:${nacosSpringContextVersion}")
        api("javax.xml.bind:jaxb-api:${jaxbVersion}")
        api("org.mapstruct:mapstruct:${mapstructVersion}")
        api("org.mapstruct:mapstruct-processor:${mapstructVersion}")
        api("org.passay:passay-spring:${passayVersion}")
        api("com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-config:${springCloudAlibabaVersion}")
    }
}
